# docker-compose.yml
# =================================
# Orchestrates Tabletop Sage multi-container stack:
# - backend: FastAPI API, SQLAlchemy SQLite, ChromaDB vector store
# - frontend: Streamlit UI
# - ollama: Local LLM inference engine
#
# Usage:
#   docker-compose up --build
#   docker-compose down

services:

  # ── Backend Service (FastAPI + ChromaDB + SQLAlchemy) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabletop-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
      - backend_docs:/app/docs
      - backend_chroma:/app/rag_db
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Frontend Service (Streamlit Web UI) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tabletop-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  # ── Ollama LLM Service (Local Inference Engine) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: tabletop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

# ── Named Persistent Volumes ──────────────────────────────────────────────────
volumes:
  backend_data:
    name: tabletop_backend_data
  backend_docs:
    name: tabletop_backend_docs
  backend_chroma:
    name: tabletop_backend_chroma
  ollama_data:
    name: tabletop_ollama_data


